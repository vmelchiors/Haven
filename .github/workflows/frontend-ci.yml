name: Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  frontend-tests:
    # Keep this context compatible with the required status check configured
    # for the protected branch until an administrator can rename that rule.
    name: .github/workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build
