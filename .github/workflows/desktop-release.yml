name: Release Desktop Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Desktop Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri Windows App
        working-directory: desktop
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Haven ${{ steps.vars.outputs.tag }} — Windows
          body: |
            ## 🛡️ Haven ${{ steps.vars.outputs.tag }} — Windows Release

            ### 📦 Download:
            - **Windows**: `Haven_${{ steps.vars.outputs.tag }}_x64-setup.exe` (Instalador NSIS)

            ---
            ### ✨ Recursos:
            - 🎙️ Motor de voz WebRTC bidirecional de ultra-baixa latência.
            - 🖥️ Compartilhamento de tela e câmera em alta definição.
            - 💬 Chat contínuo com virtualização de mensagens.
            - 🔒 Arquitetura Zero-PII com segurança criptográfica.
            - 💳 Pagamento PIX direto sem intermediários.
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
