name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build Android APK
        working-directory: android
        run: bash ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare installable preview
        working-directory: android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Haven-Android-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum Haven-Android-debug.apk > Haven-Android-debug.apk.sha256

      - name: Publish Android APK
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/Haven-Android-debug.apk
            android/app/build/outputs/apk/debug/Haven-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
